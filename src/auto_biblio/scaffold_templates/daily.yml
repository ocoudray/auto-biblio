# Template: `auto-biblio init` fills in the version; literal dollar signs are doubled here.
name: Daily collection

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: auto-biblio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install auto-biblio
        run: uv tool install git+https://github.com/ocoudray/auto-biblio@v$version
      - name: Collect
        run: auto-biblio collect
        env:
          AUTO_BIBLIO_GITHUB_TOKEN: $${{ secrets.GITHUB_TOKEN }}
      - name: Commit state
        run: |
          if [ -n "$$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "collect: $$(date -u +%Y-%m-%d)"
            git push
          fi
