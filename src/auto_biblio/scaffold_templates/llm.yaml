# LLM catalogue, chains of models per role and weekly budget.
# Model ids are pydantic-ai ids: "<provider>:<model>". Supported providers: google, anthropic.
# Prices are per million tokens; 0 means a free quota. Checked on 2026-10-10:
#   - gemini-3.5-flash-lite, gemini-3.5-flash and gemma-4-31b-it: free tier of Google AI
#     Studio, one key for all, separate rate limits per model.
#   - to add a paid fallback later, e.g. Claude Haiku 5.5 (0.10 / 0.50 USD):
#       haiku: {id: anthropic:claude-haiku-5-5, input_usd_per_mtok: 0.10,
#               output_usd_per_mtok: 0.50, batch_size: 15}
#     then append it to the chain and set the ANTHROPIC_API_KEY secret.
# min_interval_s spaces the calls to a model to stay under its requests-per-minute cap (free
# tier: 5/min for flash). A call refused by a rate limit or an overloaded provider is retried
# up to max_retries times (default 2), after the delay the provider asks for, before the next
# model of the chain takes over.
models:
  flash-lite:
    id: google:gemini-3.5-flash-lite
    input_usd_per_mtok: 0
    output_usd_per_mtok: 0
    batch_size: 20
    min_interval_s: 5
  flash:
    id: google:gemini-3.5-flash
    input_usd_per_mtok: 0
    output_usd_per_mtok: 0
    batch_size: 1
    max_output_tokens: 8192
    min_interval_s: 13
  gemma:
    id: google:gemma-4-31b-it
    input_usd_per_mtok: 0
    output_usd_per_mtok: 0
    batch_size: 10
    min_interval_s: 3

# Models tried in order: Gemma takes over when the first model hits its quota or fails.
# A model whose API key is missing is skipped.
chains:
  triage: [flash-lite, gemma]       # rate a batch of items against the profile
  short_note: [flash, gemma]        # short note from the abstract
  deep_analysis: [flash, gemma]     # deep analysis from the full text
  synthesis: [flash, gemma]         # weekly theme page

# Weekly caps: tokens count for every model, dollars for paid ones only.
weekly_budget:
  usd: 0
  tokens: 600000
