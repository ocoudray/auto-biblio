[project]
site_name = "Auto Biblio Recap"
site_description = "Routine to fetch automatically new research and development on AI, and give a recap of the most relevant advances"
site_url = "https://ocoudray.github.io/auto-biblio/"
repo_url = "https://github.com/ocoudray/auto-biblio"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Triage" = "triage.md" },
  { "Upgrade to 0.2" = "upgrade-0.2.md" },
  { "Design" = [
    { "Vision" = "superpowers/specs/2026-10-10-auto-biblio-vision-design.md" },
    { "Collection spec" = "superpowers/specs/2026-10-10-socle-collecte-design.md" },
    { "Collection plan" = "superpowers/plans/2026-10-10-socle-collecte.md" },
    { "Triage spec" = "superpowers/specs/2026-10-10-triage-design.md" },
    { "Triage plan" = "superpowers/plans/2026-10-10-triage.md" },
  ] },
  { "Reference" = "reference/index.md" },
  { "Coverage" = "coverage.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_signature_annotations = true
separate_signature = true
members_order = "source"
